services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_scout
      POSTGRES_USER: football_scout
      POSTGRES_PASSWORD: football_scout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://football_scout:football_scout@postgres:5432/football_scout
    ports:
      - "8000:8000"

volumes:
  postgres_data:
